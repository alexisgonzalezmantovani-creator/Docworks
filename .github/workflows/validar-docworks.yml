name: Validar DocWorks (rama de prueba)
on:
  push:
    branches:
      - test/docworks-5-85-validation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar con Vite
        run: npm run build
      - name: Verificar integración
        run: |
          if [ -f src/verificar-modulos.cjs ]; then node src/verificar-modulos.cjs; fi
      - name: Guardar resultado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docworks-vite-dist
          path: dist/
