name: Validar DocWorks
on:
  push:
    branches:
      - main
      - work/docworks-6-pro
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar verificador de PDF
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 poppler-utils python3 python-is-python3
      - name: Verificar tipos y compilación
        run: |
          npm run typecheck
          npm run build
      - name: Verificar permisos y base de datos
        run: npm run test:database
      - name: Verificar integración
        run: |
          if [ -f src/verificar-modulos.cjs ]; then node src/verificar-modulos.cjs; fi
      - name: Guardar resultado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: docworks-vite-dist
          path: dist/

  pruebas_aplicacion:
    name: Pruebas de aplicación (grupo ${{ matrix.grupo }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        grupo: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar herramientas de documentos
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 poppler-utils python3 python-is-python3
      - name: Ejecutar pruebas del grupo
        run: node scripts/test-shard.cjs ${{ matrix.grupo }}

  browsers:
    name: Editores en ${{ matrix.browser }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Instalar navegador y bibliotecas
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Instalar herramientas de documentos
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 poppler-utils python3 python-is-python3
      - name: Preparar visor PDF local
        run: npm run prebuild
      - name: Capturar componentes para la web pública
        if: matrix.browser == 'chromium'
        run: npm run capture:gallery
      - name: Guardar galería con datos ficticios
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: docworks-galeria
          path: gallery-results/
          retention-days: 14
      - name: Verificar ocho editores en tres tamaños
        env:
          DOCWORKS_BROWSER_OUTPUT: .browser-results/${{ matrix.browser }}
        run: |
          set -o pipefail
          mkdir -p "$DOCWORKS_BROWSER_OUTPUT"
          if [ "${{ matrix.browser }}" = "webkit" ]; then
            npm run test:webkit 2>&1 | tee "$DOCWORKS_BROWSER_OUTPUT/resultados.log"
          else
            npm run test:browser 2>&1 | tee "$DOCWORKS_BROWSER_OUTPUT/resultados.log"
          fi
      - name: Guardar resultados y capturas ficticias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docworks-editores-${{ matrix.browser }}
          path: |
            .browser-results/${{ matrix.browser }}/*.log
            .browser-results/${{ matrix.browser }}/*.png
          if-no-files-found: warn
          retention-days: 14
